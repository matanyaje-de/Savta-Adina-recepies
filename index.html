<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ספר המתכונים של סבתא</title>
  <meta name="description" content="אוסף מתכונים נדירים מהמחברות של סבתא">
  <meta name="theme-color" content="#8C6D56">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%238C6D56'/%3E%3Cpath d='M8 8h13a3 3 0 0 1 3 3v13H11a3 3 0 0 1-3-3z' fill='none' stroke='%23F9F6F0' stroke-width='2'/%3E%3Cpath d='M16 20l-3-3a2 2 0 1 1 3-2.6 2 2 0 1 1 3 2.6z' fill='%23F9F6F0'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="top-rule"></div>

  <header class="site-header">
    <span class="header-quote" aria-hidden="true">&rdquo;</span>
    <span class="header-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
        <path d="M14.5 12.5l-2.5-2.4a1.6 1.6 0 1 1 2.5-2 1.6 1.6 0 1 1 2.5 2z"></path>
      </svg>
    </span>
    <h1>ספר המתכונים של סבתא</h1>
    <p class="subtitle">אוסף של 20 מתכונים נדירים מהמחברות של 1987. טעמים שלא שוכחים.</p>
    <div class="header-rule"></div>
  </header>

  <main>
    <!-- תצוגת ספר: סינון, חיפוש וגלריית מתכונים -->
    <section id="book-view">
      <div class="toolbar">
        <div class="categories" id="categories" role="group" aria-label="סינון לפי קטגוריה"></div>

        <div class="search">
          <label class="visually-hidden" for="search-input">חיפוש מתכון או מצרך</label>
          <input type="search" id="search-input" placeholder="חיפוש מתכון או מצרך..." autocomplete="off">
          <span class="search-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
          </span>
        </div>
      </div>

      <div class="grid" id="recipe-grid"></div>

      <div class="empty-state" id="empty-state" hidden>
        <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <p>לא נמצאו מתכונים שתואמים לחיפוש שלך.</p>
      </div>
    </section>

    <!-- תצוגת מתכון בודד -->
    <section id="recipe-view" hidden></section>
  </main>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
